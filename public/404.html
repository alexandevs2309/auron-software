    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1A56DB" />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('auron-theme');
          var dark = stored === 'dark';
          if (stored === null) {
            dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          document.documentElement.classList.toggle('auron-dark', dark);
          document.documentElement.classList.toggle('auron-light', !dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          document.documentElement.style.backgroundColor = dark ? '#020617' : '#ffffff';
        } catch (e) {}
      })();
    </script>
